<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>matzip | 맛집 검색</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#FF8C69',
          cream: '#FFFBF7',
          ink: '#333333',
        },
        fontFamily: {
          sans: ['Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'sans-serif'],
        },
        borderRadius: {
          xl2: '1.5rem',
        },
        boxShadow: {
          soft: '0 1px 2px rgba(51,51,51,0.04), 0 4px 14px rgba(51,51,51,0.05)',
          'soft-md': '0 6px 20px rgba(51,51,51,0.08)',
          'soft-lg': '0 16px 36px rgba(51,51,51,0.12)',
        },
        screens: {
          tablet: '768px',
          desktop: '1440px',
        },
      }
    }
  }
</script>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
</style>
</head>
<body class="bg-cream text-ink">

  <!-- API 키 안내 배너 -->
  <div id="api-key-banner" class="bg-primary text-white text-xs tablet:text-sm text-center px-4 py-2.5">
    ⚠️ 카카오 REST API 키가 설정되지 않았어요. 이 파일 상단의 <code class="bg-white/20 px-1.5 py-0.5 rounded">KAKAO_REST_API_KEY</code> 값을
    <a href="https://developers.kakao.com/console/app" target="_blank" rel="noopener noreferrer" class="underline font-semibold">카카오 디벨로퍼스</a>에서 발급받은
    본인의 무료 REST API 키로 교체해야 검색이 동작합니다.
  </div>

  <!-- Header -->
  <header class="px-5 py-6 tablet:px-6 max-w-6xl desktop:max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="font-extrabold text-primary text-lg tablet:text-xl">matzip</a>
    <a href="index.html" class="text-sm text-ink/50 hover:text-primary transition-colors">← 홈으로</a>
  </header>

  <!-- 검색 -->
  <section class="px-5 py-8 tablet:px-6 tablet:py-10 desktop:py-12 max-w-6xl desktop:max-w-7xl mx-auto">
    <div class="text-center mb-8 tablet:mb-10">
      <h1 class="text-2xl tablet:text-4xl font-extrabold tracking-tight mb-3">맛집 검색</h1>
      <p class="text-ink/55 text-sm tablet:text-base">카카오맵 데이터로 가고 싶은 맛집을 찾아보세요</p>
    </div>

    <form id="search-form" class="max-w-2xl mx-auto mb-6">
      <div class="sticky top-0 z-10 -mx-5 tablet:mx-0 px-5 tablet:px-0 py-3 tablet:py-0 mb-4 bg-cream/90 backdrop-blur tablet:bg-transparent tablet:backdrop-blur-none">
        <div class="flex items-center gap-2 bg-white rounded-full shadow-soft ring-1 ring-black/5 p-2 focus-within:ring-2 focus-within:ring-primary/40 transition-shadow">
          <input
            id="keyword-input"
            type="text"
            placeholder="예: 연남동 소금구이, 성수동 카페"
            class="flex-1 min-w-0 bg-transparent outline-none px-4 py-2.5 text-sm tablet:text-base placeholder:text-ink/40"
          >
          <button type="submit"
            class="shrink-0 bg-primary text-white font-semibold text-sm tablet:text-base px-5 tablet:px-7 py-2.5 rounded-full hover:bg-primary/90 active:scale-95 transition-all">
            검색
          </button>
        </div>
      </div>

      <!-- 카테고리 필터 -->
      <div id="category-filter" class="flex items-center gap-2 overflow-x-auto snap-x snap-mandatory pb-1 -mx-5 px-5 tablet:mx-0 tablet:px-0 tablet:pb-0 tablet:flex-wrap tablet:justify-center tablet:overflow-visible">
        <button type="button" data-category="" class="category-chip is-active shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-primary text-white shadow-soft">전체</button>
        <button type="button" data-category="한식" class="category-chip shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-white ring-1 ring-black/10 text-ink/60 hover:bg-black/5">한식</button>
        <button type="button" data-category="중식" class="category-chip shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-white ring-1 ring-black/10 text-ink/60 hover:bg-black/5">중식</button>
        <button type="button" data-category="일식" class="category-chip shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-white ring-1 ring-black/10 text-ink/60 hover:bg-black/5">일식</button>
        <button type="button" data-category="양식" class="category-chip shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-white ring-1 ring-black/10 text-ink/60 hover:bg-black/5">양식</button>
        <button type="button" data-category="카페" class="category-chip shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-white ring-1 ring-black/10 text-ink/60 hover:bg-black/5">카페</button>
        <button type="button" data-category="술집" class="category-chip shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-white ring-1 ring-black/10 text-ink/60 hover:bg-black/5">술집</button>
        <button type="button" data-category="분식" class="category-chip shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-white ring-1 ring-black/10 text-ink/60 hover:bg-black/5">분식</button>
        <button type="button" data-category="디저트" class="category-chip shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-white ring-1 ring-black/10 text-ink/60 hover:bg-black/5">디저트</button>
      </div>
    </form>

    <!-- 상태 메시지 (로딩/에러/빈 결과) -->
    <div id="status-message" class="hidden max-w-md mx-auto flex flex-col items-center text-center bg-white rounded-xl2 ring-1 ring-black/5 px-6 py-16 tablet:py-20 mb-6"></div>

    <!-- 결과 카드 그리드 -->
    <div id="results-grid" class="grid grid-cols-1 tablet:grid-cols-2 desktop:grid-cols-3 gap-5 tablet:gap-6 desktop:gap-7"></div>
  </section>

  <script>
    // ------------------------------------------------------------------
    // ⚠️ PLACEHOLDER — replace with your own free-tier Kakao REST API key
    // Get one at https://developers.kakao.com/console/app (앱 설정 > 앱 키 > REST API 키)
    // Do NOT commit a real key to a public repo.
    // ------------------------------------------------------------------
    const KAKAO_REST_API_KEY = "YOUR_KAKAO_REST_API_KEY";

    const KEYWORD_SEARCH_URL = "https://dapi.kakao.com/v2/local/search/keyword.json";
    const CATEGORY_SEARCH_URL = "https://dapi.kakao.com/v2/local/search/category.json";
    const FOOD_CATEGORY_GROUP_CODE = "FD6"; // 음식점

    const form = document.getElementById("search-form");
    const keywordInput = document.getElementById("keyword-input");
    const categoryFilter = document.getElementById("category-filter");
    const statusMessage = document.getElementById("status-message");
    const resultsGrid = document.getElementById("results-grid");

    let activeCategory = "";

    categoryFilter.addEventListener("click", (e) => {
      const chip = e.target.closest(".category-chip");
      if (!chip) return;

      activeCategory = chip.dataset.category || "";

      categoryFilter.querySelectorAll(".category-chip").forEach((el) => {
        el.classList.remove("is-active", "bg-primary", "text-white", "shadow-soft");
        el.classList.add("bg-white", "ring-1", "ring-black/10", "text-ink/60");
      });
      chip.classList.remove("bg-white", "ring-1", "ring-black/10", "text-ink/60");
      chip.classList.add("is-active", "bg-primary", "text-white", "shadow-soft");

      runSearch();
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      runSearch();
    });

    async function runSearch() {
      const keyword = keywordInput.value.trim();

      if (!keyword && !activeCategory) {
        showStatus("검색어를 입력하거나 카테고리를 선택해주세요.", "notice");
        return;
      }

      if (KAKAO_REST_API_KEY === "YOUR_KAKAO_REST_API_KEY") {
        showStatus("카카오 REST API 키가 설정되지 않았어요. 페이지 상단 안내를 참고해 키를 입력해주세요.", "notice");
        return;
      }

      showStatus("검색 중이에요…", "loading");
      resultsGrid.innerHTML = "";

      try {
        const documents = await fetchPlaces(keyword, activeCategory);

        if (!documents || documents.length === 0) {
          showStatus("검색 결과가 없어요. 다른 키워드나 카테고리로 시도해보세요.", "empty");
          return;
        }

        hideStatus();
        renderResults(documents);
      } catch (err) {
        console.error(err);
        showStatus(
          err && err.message
            ? `검색 중 문제가 발생했어요. (${err.message})`
            : "검색 중 알 수 없는 문제가 발생했어요. 잠시 후 다시 시도해주세요.",
          "error"
        );
      }
    }

    async function fetchPlaces(keyword, category) {
      // 키워드가 있으면 keyword 검색(음식점 카테고리로 한정),
      // 키워드 없이 카테고리만 선택했다면 category 검색을 사용한다.
      const useKeywordSearch = keyword.length > 0;

      const url = new URL(useKeywordSearch ? KEYWORD_SEARCH_URL : CATEGORY_SEARCH_URL);

      if (useKeywordSearch) {
        // 카테고리가 함께 선택된 경우 검색어에 카테고리명을 더해 결과를 좁힌다.
        const query = category ? `${category} ${keyword}` : keyword;
        url.searchParams.set("query", query);
        url.searchParams.set("category_group_code", FOOD_CATEGORY_GROUP_CODE);
      } else {
        url.searchParams.set("category_group_code", FOOD_CATEGORY_GROUP_CODE);
        url.searchParams.set("query", category);
      }

      const response = await fetch(url.toString(), {
        headers: {
          Authorization: `KakaoAK ${KAKAO_REST_API_KEY}`,
        },
      });

      if (!response.ok) {
        if (response.status === 401) {
          throw new Error("인증 실패 — API 키를 확인해주세요");
        }
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();
      return data.documents;
    }

    function renderResults(documents) {
      resultsGrid.innerHTML = documents.map(placeCardHtml).join("");
    }

    function placeCardHtml(place) {
      const name = escapeHtml(place.place_name || "이름 없음");
      const category = escapeHtml(shortCategory(place.category_name));
      const emoji = categoryEmoji(place.category_name);
      const address = escapeHtml(place.road_address_name || place.address_name || "주소 정보 없음");
      const phone = place.phone ? escapeHtml(place.phone) : "";
      const placeUrl = place.place_url || "";

      return `
        <article class="group bg-white rounded-xl2 shadow-soft ring-1 ring-black/5 overflow-hidden hover:shadow-soft-lg hover:-translate-y-1 transition-all duration-300">
          <div class="relative h-32 tablet:h-36 bg-gradient-to-br from-primary/25 via-primary/10 to-cream flex items-center justify-center text-4xl">
            ${emoji}
            ${category ? `<span class="absolute top-3 right-3 text-xs font-semibold text-primary bg-white/90 px-2.5 py-1 rounded-full shadow-soft">${category}</span>` : ""}
          </div>
          <div class="p-6">
            <h3 class="text-lg font-bold mb-1.5">${name}</h3>
            <p class="text-sm text-ink/55 mb-1 leading-relaxed">📍 ${address}</p>
            ${phone ? `<p class="text-sm text-ink/55 mb-4 leading-relaxed">📞 ${phone}</p>` : `<div class="mb-4"></div>`}
            <div class="flex items-center gap-2">
              <button type="button" data-saved="false"
                class="save-toggle flex-1 text-sm font-semibold px-4 py-2 rounded-full bg-primary text-white hover:bg-primary/90 active:scale-95 transition-all">
                가볼 곳 담기
              </button>
              ${
                placeUrl
                  ? `<a href="${placeUrl}" target="_blank" rel="noopener noreferrer" class="shrink-0 text-xs text-ink/50 hover:text-primary transition-colors px-1">카카오맵 →</a>`
                  : ""
              }
            </div>
          </div>
        </article>
      `;
    }

    function shortCategory(categoryName) {
      if (!categoryName) return "";
      // "음식점 > 한식 > 육류,고기" 같은 형태에서 가장 구체적인 마지막 항목을 우선 사용
      const parts = categoryName.split(">").map((s) => s.trim()).filter(Boolean);
      return parts[parts.length - 1] || categoryName;
    }

    function categoryEmoji(categoryName) {
      const name = categoryName || "";
      if (name.includes("한식")) return "🍚";
      if (name.includes("중식")) return "🥡";
      if (name.includes("일식") || name.includes("돈까스") || name.includes("초밥")) return "🍣";
      if (name.includes("양식")) return "🍝";
      if (name.includes("카페") || name.includes("디저트") || name.includes("베이커리")) return "☕";
      if (name.includes("술") || name.includes("호프") || name.includes("포차")) return "🍶";
      if (name.includes("분식")) return "🍢";
      if (name.includes("고기") || name.includes("육류")) return "🥩";
      return "🍽️";
    }

    // 결과 카드의 "가볼 곳 담기" 버튼은 저장 여부를 카드별로 시각 토글만 한다.
    // (실제 저장/영속화는 추후 Supabase 연동 시 구현 예정 — PRD 참고)
    resultsGrid.addEventListener("click", (e) => {
      const btn = e.target.closest(".save-toggle");
      if (!btn) return;

      const saved = btn.dataset.saved === "true";
      if (saved) {
        btn.dataset.saved = "false";
        btn.textContent = "가볼 곳 담기";
        btn.classList.remove("bg-primary/10", "text-primary", "ring-1", "ring-primary/30");
        btn.classList.add("bg-primary", "text-white");
      } else {
        btn.dataset.saved = "true";
        btn.textContent = "담았어요 ✓";
        btn.classList.remove("bg-primary", "text-white");
        btn.classList.add("bg-primary/10", "text-primary", "ring-1", "ring-primary/30");
      }
    });

    // 상태 패널: 로딩 / 빈 결과 / 에러 / 안내를 아이콘+제목+설명 패널로 통일해서 보여준다.
    function showStatus(message, type) {
      const icons = { loading: "⏳", empty: "🔍", error: "⚠️", notice: "💬" };
      const titles = {
        loading: "검색하고 있어요",
        empty: "검색 결과가 없어요",
        error: "문제가 발생했어요",
        notice: "안내",
      };
      const key = icons[type] ? type : "notice";

      statusMessage.innerHTML = `
        <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center text-3xl mb-5">${icons[key]}</div>
        <h3 class="text-lg tablet:text-xl font-bold mb-2">${titles[key]}</h3>
        <p class="text-sm text-ink/55 max-w-sm leading-relaxed">${escapeHtml(message)}</p>
        ${
          key === "empty" || key === "error"
            ? `<button type="button" id="status-retry" class="mt-6 bg-primary text-white text-sm font-semibold px-5 py-2.5 rounded-full hover:bg-primary/90 active:scale-95 transition-all">다시 시도</button>`
            : ""
        }
      `;
      statusMessage.classList.remove("hidden");
    }

    statusMessage.addEventListener("click", (e) => {
      if (e.target.closest("#status-retry")) runSearch();
    });

    function hideStatus() {
      statusMessage.classList.add("hidden");
      statusMessage.innerHTML = "";
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>

</body>
</html>
