<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>matzip | 지역별 둘러보기</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#FF8C69',
          cream: '#FFFBF7',
          ink: '#333333',
        },
        fontFamily: {
          sans: ['Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'sans-serif'],
        },
        borderRadius: {
          xl2: '1.5rem',
        },
        boxShadow: {
          soft: '0 1px 2px rgba(51,51,51,0.04), 0 4px 14px rgba(51,51,51,0.05)',
          'soft-md': '0 6px 20px rgba(51,51,51,0.08)',
          'soft-lg': '0 16px 36px rgba(51,51,51,0.12)',
        },
        screens: {
          tablet: '768px',
          desktop: '1440px',
        },
      }
    }
  }
</script>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
</style>
</head>
<body class="bg-cream text-ink">

  <!-- API 키 안내 배너 -->
  <div id="api-key-banner" class="hidden bg-primary text-white text-xs tablet:text-sm text-center px-4 py-2.5">
    ⚠️ 카카오 REST API 키가 설정되지 않았어요. 이 파일 상단의 <code class="bg-white/20 px-1.5 py-0.5 rounded">KAKAO_REST_API_KEY</code> 값을
    <a href="https://developers.kakao.com/console/app" target="_blank" rel="noopener noreferrer" class="underline font-semibold">카카오 디벨로퍼스</a>에서 발급받은
    본인의 무료 REST API 키로 교체해야 검색이 동작합니다.
  </div>

  <!-- Header -->
  <header class="px-5 py-6 tablet:px-6 max-w-6xl desktop:max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="font-extrabold text-primary text-lg tablet:text-xl">matzip</a>
    <nav class="flex items-center gap-4 tablet:gap-6 text-sm">
      <a href="search.html" class="text-ink/50 hover:text-primary transition-colors">검색</a>
      <a href="index.html" class="text-ink/50 hover:text-primary transition-colors">← 홈으로</a>
    </nav>
  </header>

  <!-- 지역별 둘러보기 -->
  <section class="px-5 py-8 tablet:px-6 tablet:py-10 desktop:py-12 max-w-6xl desktop:max-w-7xl mx-auto">
    <div class="text-center mb-8 tablet:mb-10">
      <h1 class="text-2xl tablet:text-4xl font-extrabold tracking-tight mb-3">지역별 둘러보기</h1>
      <p class="text-ink/55 text-sm tablet:text-base">시/도와 시/군/구, 음식 종류를 골라 맛집을 찾아보세요</p>
    </div>

    <div class="max-w-3xl mx-auto space-y-5 mb-8">
      <!-- 1단계: 시/도 -->
      <div>
        <h2 class="text-xs tablet:text-sm font-semibold text-ink/45 mb-2.5">1. 시/도</h2>
        <div id="sido-filter" class="flex items-center gap-2 overflow-x-auto snap-x snap-mandatory pb-1 -mx-5 px-5 tablet:mx-0 tablet:px-0 tablet:pb-0 tablet:flex-wrap"></div>
      </div>

      <!-- 2단계: 시/군/구 -->
      <div>
        <h2 class="text-xs tablet:text-sm font-semibold text-ink/45 mb-2.5">2. 시/군/구</h2>
        <div id="sigungu-filter" class="flex items-center gap-2 overflow-x-auto snap-x snap-mandatory pb-1 -mx-5 px-5 tablet:mx-0 tablet:px-0 tablet:pb-0 tablet:flex-wrap"></div>
      </div>

      <!-- 3단계: 카테고리 -->
      <div>
        <h2 class="text-xs tablet:text-sm font-semibold text-ink/45 mb-2.5">3. 음식 종류</h2>
        <div id="category-filter" class="flex items-center gap-2 overflow-x-auto snap-x snap-mandatory pb-1 -mx-5 px-5 tablet:mx-0 tablet:px-0 tablet:pb-0 tablet:flex-wrap"></div>
      </div>
    </div>

    <!-- 상태 메시지 (초기 안내/로딩/빈 결과/에러) -->
    <div id="status-message" class="hidden max-w-md mx-auto flex flex-col items-center text-center bg-white rounded-xl2 ring-1 ring-black/5 px-6 py-16 tablet:py-20 mb-6"></div>

    <!-- 결과 카드 그리드 -->
    <div id="results-grid" class="grid grid-cols-1 tablet:grid-cols-2 desktop:grid-cols-3 gap-5 tablet:gap-6 desktop:gap-7"></div>
  </section>

  <script>
    // ------------------------------------------------------------------
    // search.html과 동일한 카카오 REST API 키를 사용한다 (같은 무료 티어 키).
    // ------------------------------------------------------------------
    const KAKAO_REST_API_KEY = "70a1aaa9d5d793b2cc43902b9b334172";
    const KEYWORD_SEARCH_URL = "https://dapi.kakao.com/v2/local/search/keyword.json";
    const FOOD_CATEGORY_GROUP_CODE = "FD6"; // 음식점

    // 시/도 → 시/군/구 목록. 카카오 API에는 시/도 단위로 직접 전달하지 않고,
    // 검색 쿼리에 "시/군/구 + 카테고리" 텍스트로 조합해 넣는다 (시/도는 UI 그룹핑 전용).
    const REGIONS = {
      "서울특별시": ["종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구","노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구","관악구","서초구","강남구","송파구","강동구"],
      "부산광역시": ["중구","서구","동구","영도구","부산진구","동래구","남구","북구","해운대구","사하구","금정구","강서구","연제구","수영구","사상구","기장군"],
      "대구광역시": ["중구","동구","서구","남구","북구","수성구","달서구","달성군","군위군"],
      "인천광역시": ["중구","동구","미추홀구","연수구","남동구","부평구","계양구","서구","강화군","옹진군"],
      "광주광역시": ["동구","서구","남구","북구","광산구"],
      "대전광역시": ["동구","중구","서구","유성구","대덕구"],
      "울산광역시": ["중구","남구","동구","북구","울주군"],
      "세종특별자치시": ["세종시"],
      "경기도": ["수원시","성남시","의정부시","안양시","부천시","광명시","평택시","동두천시","안산시","고양시","과천시","구리시","남양주시","오산시","시흥시","군포시","의왕시","하남시","용인시","파주시","이천시","안성시","김포시","화성시","광주시","양주시","포천시","여주시","연천군","가평군","양평군"],
      "강원특별자치도": ["춘천시","원주시","강릉시","동해시","태백시","속초시","삼척시","홍천군","횡성군","영월군","평창군","정선군","철원군","화천군","양구군","인제군","고성군","양양군"],
      "충청북도": ["청주시","충주시","제천시","보은군","옥천군","영동군","증평군","진천군","괴산군","음성군","단양군"],
      "충청남도": ["천안시","공주시","보령시","아산시","서산시","논산시","계룡시","당진시","금산군","부여군","서천군","청양군","홍성군","예산군","태안군"],
      "전북특별자치도": ["전주시","군산시","익산시","정읍시","남원시","김제시","완주군","진안군","무주군","장수군","임실군","순창군","고창군","부안군"],
      "전라남도": ["목포시","여수시","순천시","나주시","광양시","담양군","곡성군","구례군","고흥군","보성군","화순군","장흥군","강진군","해남군","영암군","무안군","함평군","영광군","장성군","완도군","진도군","신안군"],
      "경상북도": ["포항시","경주시","김천시","안동시","구미시","영주시","영천시","상주시","문경시","경산시","의성군","청송군","영양군","영덕군","청도군","고령군","성주군","칠곡군","예천군","봉화군","울진군","울릉군"],
      "경상남도": ["창원시","진주시","통영시","사천시","김해시","밀양시","거제시","양산시","의령군","함안군","창녕군","고성군","남해군","하동군","산청군","함양군","거창군","합천군"],
      "제주특별자치도": ["제주시","서귀포시"],
    };

    const CATEGORIES = ["한식","중식","일식","양식","카페","술집","분식","디저트"];

    const sidoFilter = document.getElementById("sido-filter");
    const sigunguFilter = document.getElementById("sigungu-filter");
    const categoryFilter = document.getElementById("category-filter");
    const statusMessage = document.getElementById("status-message");
    const resultsGrid = document.getElementById("results-grid");

    let activeSido = "";
    let activeSigungu = "";
    let activeCategory = "";

    function chipHtml(value, label, isActive) {
      const activeClasses = "is-active shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-primary text-white shadow-soft";
      const inactiveClasses = "shrink-0 snap-start text-xs tablet:text-sm font-semibold px-4 py-2 rounded-full transition-colors bg-white ring-1 ring-black/10 text-ink/60 hover:bg-black/5";
      return `<button type="button" data-value="${escapeHtml(value)}" class="chip ${isActive ? activeClasses : inactiveClasses}">${escapeHtml(label)}</button>`;
    }

    function renderSidoChips() {
      sidoFilter.innerHTML = Object.keys(REGIONS)
        .map((sido) => chipHtml(sido, sido, sido === activeSido))
        .join("");
    }

    function renderSigunguChips() {
      if (!activeSido) {
        sigunguFilter.innerHTML = `<p class="text-sm text-ink/40 py-2">먼저 시/도를 선택해주세요.</p>`;
        return;
      }
      sigunguFilter.innerHTML = REGIONS[activeSido]
        .map((gu) => chipHtml(gu, gu, gu === activeSigungu))
        .join("");
    }

    function renderCategoryChips() {
      categoryFilter.innerHTML =
        chipHtml("", "전체", activeCategory === "") +
        CATEGORIES.map((c) => chipHtml(c, c, c === activeCategory)).join("");
    }

    sidoFilter.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      activeSido = chip.dataset.value;
      activeSigungu = "";
      renderSidoChips();
      renderSigunguChips();
      showStatus("시/군/구를 선택해주세요.", "notice");
      resultsGrid.innerHTML = "";
    });

    sigunguFilter.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      activeSigungu = chip.dataset.value;
      renderSigunguChips();
      runSearch();
    });

    categoryFilter.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      activeCategory = chip.dataset.value;
      renderCategoryChips();
      if (activeSigungu) runSearch();
    });

    async function runSearch() {
      if (!activeSigungu) {
        showStatus("지역을 선택해주세요.", "notice");
        return;
      }

      showStatus("검색 중이에요…", "loading");
      resultsGrid.innerHTML = "";

      try {
        const documents = await fetchPlaces(activeSigungu, activeCategory);

        if (!documents || documents.length === 0) {
          showStatus("검색 결과가 없어요. 다른 지역이나 음식 종류로 시도해보세요.", "empty");
          return;
        }

        hideStatus();
        renderResults(documents);
      } catch (err) {
        console.error(err);
        showStatus(
          err && err.message
            ? `검색 중 문제가 발생했어요. (${err.message})`
            : "검색 중 알 수 없는 문제가 발생했어요. 잠시 후 다시 시도해주세요.",
          "error"
        );
      }
    }

    async function fetchPlaces(sigungu, category) {
      const query = category ? `${sigungu} ${category}` : sigungu;

      const url = new URL(KEYWORD_SEARCH_URL);
      url.searchParams.set("query", query);
      url.searchParams.set("category_group_code", FOOD_CATEGORY_GROUP_CODE);

      const response = await fetch(url.toString(), {
        headers: {
          Authorization: `KakaoAK ${KAKAO_REST_API_KEY}`,
        },
      });

      if (!response.ok) {
        if (response.status === 401) {
          throw new Error("인증 실패 — API 키를 확인해주세요");
        }
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();
      return data.documents;
    }

    function renderResults(documents) {
      resultsGrid.innerHTML = documents.map(placeCardHtml).join("");
    }

    function placeCardHtml(place) {
      const name = escapeHtml(place.place_name || "이름 없음");
      const category = escapeHtml(shortCategory(place.category_name));
      const emoji = categoryEmoji(place.category_name);
      const address = escapeHtml(place.road_address_name || place.address_name || "주소 정보 없음");
      const phone = place.phone ? escapeHtml(place.phone) : "";
      const placeUrl = place.place_url || "";

      return `
        <article class="group bg-white rounded-xl2 shadow-soft ring-1 ring-black/5 overflow-hidden hover:shadow-soft-lg hover:-translate-y-1 transition-all duration-300">
          <div class="relative h-32 tablet:h-36 bg-gradient-to-br from-primary/25 via-primary/10 to-cream flex items-center justify-center text-4xl">
            ${emoji}
            ${category ? `<span class="absolute top-3 right-3 text-xs font-semibold text-primary bg-white/90 px-2.5 py-1 rounded-full shadow-soft">${category}</span>` : ""}
          </div>
          <div class="p-6">
            <h3 class="text-lg font-bold mb-1.5">${name}</h3>
            <p class="text-sm text-ink/55 mb-1 leading-relaxed">📍 ${address}</p>
            ${phone ? `<p class="text-sm text-ink/55 mb-4 leading-relaxed">📞 ${phone}</p>` : `<div class="mb-4"></div>`}
            <div class="flex items-center gap-2">
              <button type="button" data-saved="false"
                class="save-toggle flex-1 text-sm font-semibold px-4 py-2 rounded-full bg-primary text-white hover:bg-primary/90 active:scale-95 transition-all">
                가볼 곳 담기
              </button>
              ${
                placeUrl
                  ? `<a href="${placeUrl}" target="_blank" rel="noopener noreferrer" class="shrink-0 text-xs text-ink/50 hover:text-primary transition-colors px-1">카카오맵 →</a>`
                  : ""
              }
            </div>
          </div>
        </article>
      `;
    }

    function shortCategory(categoryName) {
      if (!categoryName) return "";
      const parts = categoryName.split(">").map((s) => s.trim()).filter(Boolean);
      return parts[parts.length - 1] || categoryName;
    }

    function categoryEmoji(categoryName) {
      const name = categoryName || "";
      if (name.includes("한식")) return "🍚";
      if (name.includes("중식")) return "🥡";
      if (name.includes("일식") || name.includes("돈까스") || name.includes("초밥")) return "🍣";
      if (name.includes("양식")) return "🍝";
      if (name.includes("카페") || name.includes("디저트") || name.includes("베이커리")) return "☕";
      if (name.includes("술") || name.includes("호프") || name.includes("포차")) return "🍶";
      if (name.includes("분식")) return "🍢";
      if (name.includes("고기") || name.includes("육류")) return "🥩";
      return "🍽️";
    }

    resultsGrid.addEventListener("click", (e) => {
      const btn = e.target.closest(".save-toggle");
      if (!btn) return;

      const saved = btn.dataset.saved === "true";
      if (saved) {
        btn.dataset.saved = "false";
        btn.textContent = "가볼 곳 담기";
        btn.classList.remove("bg-primary/10", "text-primary", "ring-1", "ring-primary/30");
        btn.classList.add("bg-primary", "text-white");
      } else {
        btn.dataset.saved = "true";
        btn.textContent = "담았어요 ✓";
        btn.classList.remove("bg-primary", "text-white");
        btn.classList.add("bg-primary/10", "text-primary", "ring-1", "ring-primary/30");
      }
    });

    function showStatus(message, type) {
      const icons = { loading: "⏳", empty: "🔍", error: "⚠️", notice: "💬" };
      const titles = {
        loading: "검색하고 있어요",
        empty: "검색 결과가 없어요",
        error: "문제가 발생했어요",
        notice: "안내",
      };
      const key = icons[type] ? type : "notice";

      statusMessage.innerHTML = `
        <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center text-3xl mb-5">${icons[key]}</div>
        <h3 class="text-lg tablet:text-xl font-bold mb-2">${titles[key]}</h3>
        <p class="text-sm text-ink/55 max-w-sm leading-relaxed">${escapeHtml(message)}</p>
        ${
          key === "empty" || key === "error"
            ? `<button type="button" id="status-retry" class="mt-6 bg-primary text-white text-sm font-semibold px-5 py-2.5 rounded-full hover:bg-primary/90 active:scale-95 transition-all">다시 시도</button>`
            : ""
        }
      `;
      statusMessage.classList.remove("hidden");
    }

    statusMessage.addEventListener("click", (e) => {
      if (e.target.closest("#status-retry")) runSearch();
    });

    function hideStatus() {
      statusMessage.classList.add("hidden");
      statusMessage.innerHTML = "";
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // 초기 상태: 첫 시/도를 기본 선택해 바로 시/군/구를 고를 수 있게 한다.
    activeSido = Object.keys(REGIONS)[0];
    renderSidoChips();
    renderSigunguChips();
    renderCategoryChips();
    showStatus("시/군/구를 선택해주세요.", "notice");
  </script>

</body>
</html>
